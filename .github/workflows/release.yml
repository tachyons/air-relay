name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=$PWD/android/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK
        run: make android-release
      - name: Collect APK
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$GITHUB_REF_NAME" ] && version=${GITHUB_SHA::7}
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "AirRelay-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: AirRelay-*.apk
          retention-days: 30

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build release app
        run: |
          set -o pipefail
          make macos-release | xcbeautify --renderer github-actions
      - name: Package app
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$GITHUB_REF_NAME" ] && version=${GITHUB_SHA::7}
          ditto -c -k --sequesterRsrc --keepParent \
            macos/.build/xcode/Build/Products/Release/AirRelay.app \
            "AirRelay-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: AirRelay-*.zip
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            AirRelay-*.apk
            AirRelay-*.zip
