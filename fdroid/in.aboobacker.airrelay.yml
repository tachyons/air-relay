AutoName: Air Relay

Summary: Keep your phone and Mac in sync over your own network
Description: |-
  Air Relay mirrors what happens on your Android phone to your Mac, and lets you
  act on it from there, over a direct encrypted connection on your local
  network.

  Notifications appear on the Mac and can be replied to. Calls ring on both,
  and can be answered, declined or hung up from the Mac with the phone
  switching to speakerphone. Clipboard, files, Focus mode and media controls
  sync both ways, and there is a "find my phone" ring from the menu bar.

  There is no account, no server and no telemetry: the two apps find each other
  with Bonjour, pair once by scanning a QR code or comparing a short code, and
  pin each other's certificates afterwards. Nothing leaves your network.

  The phone app asks for notification access, call control and camera only for
  the features that use them. It reads neither your contacts nor your call log.

