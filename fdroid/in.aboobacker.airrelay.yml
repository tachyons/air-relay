# metadata/in.aboobacker.airrelay.yml. Kept here so the recipe travels with
# the source it describes; keep Builds in sync when tagging a release.
#
# F-Droid signs with its own key, so an F-Droid install cannot be updated with
# a GitHub-release APK (or vice versa) — users pick one source and stay on it.

